# MoStar Grid — public reverse proxy
# Terminates grid.mostarsystems.com / api.mostarsystems.com / voice.mostarsystems.com
# on the VPS and forwards to the loopback-only PM2 services started by
# deploy_grid_vps.sh. DNS for these hostnames is NOT yet pointed at this VPS —
# see deploy/setup_domain_grid.sh for the cutover order.

server {
    listen 80;
    listen [::]:80;
    server_name grid.mostarsystems.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:41012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.mostarsystems.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:41010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name voice.mostarsystems.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:41071;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After DNS is live and `certbot --nginx` has run for these three server_names,
# certbot rewrites each block above into a matching :443 ssl block. Do not
# hand-add :443 blocks ahead of that — certbot's rewrite is idempotent, a
# pre-existing manual one is not.
