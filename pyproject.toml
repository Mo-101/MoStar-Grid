[project]
name = "mostar-grid-core"
version = "0.1.0"
description = "Executable canon for MoStar Grid: Woo interprets, TruthEngine governs, Grid executes."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "back/services",
  "core/engines",
  "core/sovereignty",
  "core/protocols",
  "core/ops"
]
testpaths = ["core/ops/tests"]

[tool.pyright]
extraPaths = [
  "back/services",
  "core/engines",
  "core/sovereignty",
  "core/protocols",
  "core/ops"
]
