[project]
name = "mostar-core"
version = "0.1.0"
description = "MoStar AI Core Kernel - FGrid Entity and Runtime Engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0"
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "core",
    "services"
]
testpaths = ["tests"]
